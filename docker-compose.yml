version: '3.8'
services:
  chat-server:
    build: .
    ports:
      - "3333:3333"
    environment:
      - VENICE_API_KEY=${VENICE_API_KEY}
      - PORTABLELM_PROFILE=cybersecurity
    depends_on:
      - redis
  mcp-server:
    build: .
    ports:
      - "3334:3334"
    environment:
      - PORTABLELM_PROFILE=cybersecurity
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  redis-data:
